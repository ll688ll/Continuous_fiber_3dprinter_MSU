[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "printer_msu"
version = "0.0.0"
description = "Multi-module 3D printer control program (PySide6 UI, controller plugins, G-code streaming)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"printer_msu.controllers.motion.fmc006ge31" = ["vendor/*"]


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fmc-motion"
version = "0.1.0"
description = "Standalone multi-axis motion control library for FMC006GE31 6-axis controllers (real hardware + simulation backends)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]
dev = ["pytest>=7", "PyYAML>=6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fmc_motion" = ["vendor/win64/*", "vendor/win32/*"]

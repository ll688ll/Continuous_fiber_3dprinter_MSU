[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "printer_msu"
dynamic = ["version"]
description = "Multi-module 3D printer control program (PySide6 UI, controller plugins, G-code streaming)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# The core (Duet backend, G-code, services) is stdlib-only. Everything else is
# an extra so headless/library consumers stay lightweight (PRD Q7):
#   ui   the PySide6 desktop console
#   sim  the FMC simulator backend behind configs/printer_sim*.json and the
#        sim tests. fmc-motion lives in libs/fmc-motion and is NOT on PyPI:
#        install it from there (dev) or from its wheel with --find-links.
dependencies = []

[project.scripts]
printer-msu = "printer_msu.cli:main"

[project.optional-dependencies]
ui = [
  "PySide6>=6.6",
]
sim = [
  "fmc-motion==1.1.1",
]
dev = [
  "pytest>=7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "printer_msu.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
